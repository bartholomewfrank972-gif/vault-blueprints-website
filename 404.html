<title>Page not found | Vault Blueprints</title>
<link rel="stylesheet" href="/product.css">
<style>
.error-page{min-height:100svh;display:grid;place-items:center;padding:2rem 1rem;background:#f5f7fb;color:#101b35;text-align:center}
.error-content{max-width:38rem}.error-code{font-size:clamp(4rem,18vw,8rem);line-height:1;font-weight:800;letter-spacing:-.07em;color:#3459dc;margin:0}

.error-actions{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}.error-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:2.9rem;padding:.8rem 1.1rem;border-radius:999px;background:#3459dc;color:#fff;text-decoration:none;font-weight:700}.error-actions a.secondary{background:#fff;color:#101b35;border:1px solid #dce2ef}
</style>
</head>
<body>
<main class="error-page">
<div class="error-content">
<p class="error-code" aria-hidden="true">404</p>
<h1>We couldn’t find that page.</h1>
<p>The link may be outdated, or the page may have moved. You can return to the store and continue exploring practical digital resources.</p>
<div class="error-actions"><a href="/">Back to Vault Blueprints</a><a class="secondary" href="/products/">Browse product previews</a></div>
</div>
</main>
